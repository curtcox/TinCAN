name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # There are no dependencies to install. That is deliberate: the reference
      # implementation and the site build are plain ES modules and Node's own
      # test runner, so there is no lockfile to rot and nothing to audit.
      - name: Check there is nothing to install
        run: |
          test ! -f package-lock.json || (echo "unexpected lockfile" && exit 1)
          node -e "const p=require('./package.json');
            if (p.dependencies || p.devDependencies) { console.error('TinCAN must stay dependency-free'); process.exit(1); }"

      - name: Test
        run: npm test

      - name: Check the rig server starts
        run: |
          node --input-type=module -e "import('./tools/rig/server.mjs').then(async ({startRig}) => { const r = await startRig({port:0, controlPort:0, code:'000000', runsDir:'/tmp/rig-runs', certDir:'/tmp/rig-cert', host:'127.0.0.1', log:()=>{}}); const i = await (await fetch(r.controlUrl + '/info')).json(); if (i.code !== '000000') throw new Error('bad info'); await r.close(); })"

      - name: Build the site
        run: npm run build

      - name: Check the built site
        run: |
          # .nojekyll is meant to be empty: it only has to exist.
          test -f _site/.nojekyll || (echo "missing: _site/.nojekyll" && exit 1)
          for f in _site/index.html _site/style.css \
                   _site/spec/tincan-1.0.html _site/spec/transport.html \
                   _site/spec/rationale.html _site/spec/vectors.html \
                   _site/apps/snooper/index.html _site/apps/console/index.html \
                   _site/apps/simulator/index.html _site/apps/selftest/index.html \
                   _site/apps/bands/index.html _site/apps/bands/acoustics.js _site/apps/bands/sweep.js \
                   _site/apps/pair/index.html _site/apps/sidelink.js \
                   _site/spec/rig.html _site/apps/rig/index.html _site/apps/rig/app.js \
                   _site/src/tincan/rig-dsl.js \
                   _site/src/tincan/worklet.js _site/src/tincan/modem.js \
                   _site/src/tincan/bandtest.js _site/src/tincan/tones-worklet.js _site/apps/bandtest.js; do
            test -s "$f" || (echo "missing or empty: $f" && exit 1)
          done
          # Every page and report names the commit it was built from.
          node -e "const v=require('./_site/version.json');
            if (v.commit !== process.env.GITHUB_SHA) { console.error('version.json names', v.commit, 'not', process.env.GITHUB_SHA); process.exit(1); }"
          grep -q "$GITHUB_SHA" _site/version.js || (echo "version.js not stamped" && exit 1)
          grep -q 'class="version"' _site/index.html || (echo "home page has no version" && exit 1)
          grep -q 'class="version"' _site/spec/tincan-1.0.html || (echo "spec page has no version" && exit 1)
          echo "site contains $(find _site -type f | wc -l) files"
